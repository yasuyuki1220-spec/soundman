<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ファンファーレプレイヤー</title>
<style>
  :root{--bg:#14161f;--card:#1e2130;--line:#33384f;--text:#eef0f8;--sub:#9aa0b8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;padding:24px}
  h1{font-size:20px;margin:0;font-weight:600}
  .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:20px;max-width:1100px;margin:0 auto}
  .card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:20px;transition:border-color .2s, box-shadow .2s}
  .card.playing{border-color:var(--c);box-shadow:0 0 24px -4px var(--c)}
  .card.normal{--c:#3fb6ff}
  .card.fanfare{--c:#ffc233}
  .card h2{margin:0 0 12px;font-size:16px;color:var(--c)}
  .big{width:100%;height:110px;font-size:28px;font-weight:700;border:none;border-radius:14px;cursor:pointer;color:#111;background:var(--c);transition:transform .08s, filter .2s}
  .big:hover{filter:brightness(1.1)}
  .big:active{transform:scale(.98)}
  .big:disabled{background:#3a3f57;color:#777;cursor:not-allowed}
  .big.stop{background:#ff5a67;color:#fff}
  .fname{margin:12px 0 4px;font-size:13px;color:var(--sub);word-break:break-all;min-height:18px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .btn{background:#2c3047;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer}
  .btn:hover{background:#373c58}
  .yturl{flex:1;min-width:160px;background:#12141c;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
  .ytbox{overflow:hidden;border-radius:8px;margin-top:10px;height:200px}
  .ytbox.collapsed{height:0;margin-top:0}
  .ytbox iframe{width:100%;height:200px;display:block}
  canvas{width:100%;height:90px;background:#12141c;border-radius:8px;display:block;margin-top:12px;touch-action:none;cursor:ew-resize}
  .times{display:flex;gap:12px;font-size:12px;color:var(--sub);margin-top:8px;flex-wrap:wrap;align-items:center}
  .times input[type=number]{width:80px;background:#12141c;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
  label{font-size:13px;color:var(--sub);display:flex;gap:6px;align-items:center}
  input[type=range]{accent-color:var(--c)}
  .msg{color:#ff8a94;font-size:12px;min-height:16px;margin-top:6px}
  .top{max-width:1100px;margin:0 auto 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .hint{font-size:12px;color:var(--sub)}
  .card.drag{border-style:dashed}
</style>
</head>
<body>
<div class="top">
  <h1>🎺 ファンファーレプレイヤー</h1>
  <div class="hint">キー: 1=平常 / 2=ファンファーレ / Esc=全停止　※音声ファイルは枠へドラッグでも読み込めます</div>
  <button class="btn" id="stopAll">■ 全部ストップ</button>
</div>
<div class="wrap" id="wrap"></div>

<script>
(() => {
  const ACCEPT = "audio/*,.mp3,.wav,.ogg,.oga,.m4a,.aac,.flac,.opus,.webm,.mp4,.weba";
  let ctx = null;
  const getCtx = () => (ctx ||= new (window.AudioContext || window.webkitAudioContext)());

  // ---------- YouTube IFrame API ----------
  let ytApi = null;
  const loadYT = () => ytApi ||= new Promise((res, rej) => {
    if (window.YT && YT.Player) return res();
    window.onYouTubeIframeAPIReady = res;
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    s.onerror = () => { ytApi = null; rej(new Error("api")); };
    document.head.appendChild(s);
  });
  const parseYT = u => {
    u = (u || "").trim();
    try {
      const x = new URL(u);
      if (x.hostname === "youtu.be") return x.pathname.slice(1).split("/")[0] || null;
      if (/youtube\.com$/.test(x.hostname)) {
        if (x.searchParams.get("v")) return x.searchParams.get("v");
        const m = x.pathname.match(/\/(embed|shorts|live)\/([\w-]{11})/);
        if (m) return m[2];
      }
    } catch (e) {}
    return /^[\w-]{11}$/.test(u) ? u : null;
  };

  // ---------- IndexedDB ----------
  const dbp = new Promise((res, rej) => {
    const r = indexedDB.open("fanfare-player", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("slots");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }).catch(() => null);
  const dbPut = async (k, v) => { const db = await dbp; if (!db) return; db.transaction("slots","readwrite").objectStore("slots").put(v,k); };
  const dbGet = async k => { const db = await dbp; if (!db) return null; return new Promise(r => { const q = db.transaction("slots").objectStore("slots").get(k); q.onsuccess = () => r(q.result||null); q.onerror = () => r(null); }); };

  const fmt = s => { s = Math.max(0,s); const m = Math.floor(s/60); return m + ":" + (s - m*60).toFixed(1).padStart(4,"0"); };
  const slots = [];

  class Slot {
    constructor(id, title, cls, defaultLoop){
      this.id = id; this.title = title; this.cls = cls;
      this.mode = null;            // "file" | "yt"
      this.buffer = null; this.peaks = null; this.name = "";
      this.yt = null; this.ytDur = 0; this.ytId = null; this.mon = null; this.cmdAt = 0;
      this.start = 0; this.end = 0; this.loop = defaultLoop; this.volume = 0.8;
      this.src = null; this.gain = null; this.playing = false; this.t0 = 0;
      this.build();
    }
    build(){
      const el = this.el = document.createElement("div");
      el.className = "card " + this.cls;
      el.innerHTML = `
        <h2>${this.title}</h2>
        <button class="big" disabled>音楽を読み込んでください</button>
        <div class="fname"></div>
        <div class="row">
          <button class="btn load">📂 音楽ファイルを選ぶ</button>
          <label><input type="checkbox" class="loop"> くり返し再生</label>
          <label>音量 <input type="range" class="vol" min="0" max="1" step="0.01"></label>
        </div>
        <div class="row">
          <input type="text" class="yturl" placeholder="YouTubeのURLを貼り付け">
          <button class="btn ytload">▶ YouTubeを読み込む</button>
          <button class="btn ytshow" style="display:none">映像を出す</button>
        </div>
        <div class="ytbox collapsed"></div>
        <canvas></canvas>
        <div class="times">
          <label>開始 <input type="number" class="ns" step="0.1" min="0"> 秒</label>
          <label>終了 <input type="number" class="ne" step="0.1" min="0"> 秒</label>
          <span class="len"></span>
          <button class="btn reset">全体に戻す</button>
        </div>
        <div class="msg"></div>
        <input type="file" hidden accept="${ACCEPT}">`;
      this.$ = s => el.querySelector(s);
      this.big = this.$(".big"); this.cv = this.$("canvas"); this.file = this.$("input[type=file]");
      this.loopEl = this.$(".loop"); this.volEl = this.$(".vol");
      this.ns = this.$(".ns"); this.ne = this.$(".ne");
      this.loopEl.checked = this.loop; this.volEl.value = this.volume;

      this.big.onclick = () => this.toggle();
      this.$(".load").onclick = () => this.file.click();
      this.file.onchange = () => { if (this.file.files[0]) this.loadFile(this.file.files[0]); this.file.value = ""; };
      this.$(".ytload").onclick = () => this.loadYouTube(this.$(".yturl").value);
      this.$(".yturl").onkeydown = e => { if (e.key === "Enter") this.loadYouTube(e.target.value); };
      this.$(".ytshow").onclick = () => {
        const box = this.$(".ytbox"); box.classList.toggle("collapsed");
        this.$(".ytshow").textContent = box.classList.contains("collapsed") ? "映像を出す" : "映像を隠す";
      };
      this.loopEl.onchange = () => { this.loop = this.loopEl.checked; this.save(); if (this.playing) this.play(); };
      this.volEl.oninput = () => {
        this.volume = +this.volEl.value;
        if (this.gain) this.gain.gain.value = this.volume;
        if (this.mode === "yt" && this.yt && this.yt.setVolume) this.yt.setVolume(this.volume * 100);
        this.save();
      };
      this.ns.onchange = () => this.mode && this.setTrim(+this.ns.value, this.end, true);
      this.ne.onchange = () => this.mode && this.setTrim(this.start, +this.ne.value, true);
      this.$(".reset").onclick = () => this.mode && this.setTrim(0, this.duration(), true);

      el.addEventListener("dragover", e => { e.preventDefault(); el.classList.add("drag"); });
      el.addEventListener("dragleave", () => el.classList.remove("drag"));
      el.addEventListener("drop", e => { e.preventDefault(); el.classList.remove("drag"); const f = e.dataTransfer.files[0]; if (f) this.loadFile(f); });

      this.bindCanvas();
      this.draw();
    }
    duration(){ return this.mode === "yt" ? this.ytDur : this.mode === "file" ? this.buffer.duration : 0; }
    msg(t){ this.$(".msg").textContent = t || ""; }

    // ----- ファイル読み込み -----
    async loadFile(f){
      this.msg("");
      try {
        const data = await f.arrayBuffer();
        await this.setData(data, f.name);
        this.start = 0; this.end = this.buffer.duration;
        this.refreshTrimUI();
        this.save();
      } catch(e){
        this.msg("この形式はブラウザで読み込めませんでした（mp3 / wav / ogg / m4a / aac / flac / opus などが使えます）");
      }
    }
    async setData(data, name){
      const keep = data.slice(0);
      const buf = await getCtx().decodeAudioData(data);
      this.stop(); this.destroyYT();
      this._data = keep; this.buffer = buf; this.name = name; this.mode = "file";
      const ch = buf.getChannelData(0), N = 1200, step = Math.max(1, Math.floor(ch.length / N));
      this.peaks = new Float32Array(N);
      for (let i = 0; i < N; i++){ let m = 0; const a = i*step, b = Math.min(ch.length, a+step); for (let j=a;j<b;j+=Math.max(1,(step/50)|0)){ const v = Math.abs(ch[j]); if (v>m) m=v; } this.peaks[i] = m; }
      this.big.disabled = false; this.updateBtn();
      this.$(".ytshow").style.display = "none";
      this.$(".fname").textContent = "🎵 " + name + "（全体 " + fmt(buf.duration) + "）";
    }

    // ----- YouTube読み込み -----
    destroyYT(){
      clearInterval(this.mon);
      if (this.yt && this.yt.destroy) { try { this.yt.destroy(); } catch(e){} }
      this.yt = null; this.ytId = null;
      this.$(".ytbox").innerHTML = "";
    }
    async loadYouTube(url, saved){
      this.msg("");
      const id = parseYT(url);
      if (!id) return this.msg("YouTubeのURLを確認してください");
      if (location.protocol === "file:") return this.msg("YouTubeは https:// のURLで開いたときだけ使えます（GitHub Pagesなどに置いて、そのURLから開いてください）");
      this.msg("YouTubeを読み込み中…");
      try { await loadYT(); } catch(e){ return this.msg("YouTubeに接続できませんでした（ネット接続を確認してください）"); }
      this.stop(); this.destroyYT();
      this.buffer = null; this.peaks = null; this.mode = null;
      const mount = document.createElement("div");
      this.$(".ytbox").appendChild(mount);
      let initDone = false;
      const dur = await new Promise(resolve => {
        const fin = v => { if (!initDone){ initDone = true; resolve(v); } };
        this.yt = new YT.Player(mount, {
          width: "100%", height: "200", videoId: id,
          playerVars: { controls: 0, disablekb: 1, playsinline: 1, rel: 0, origin: location.origin },
          events: {
            onReady: e => { let n = 0; const iv = setInterval(() => { const d = e.target.getDuration(); if (d > 0 || ++n > 25){ clearInterval(iv); fin(d); } }, 200); },
            onError: e => { if (!initDone) fin(-e.data); else this.ytError(e.data); },
            onStateChange: e => this.onYTState(e.data)
          }
        });
      });
      if (dur <= 0){
        this.destroyYT(); this.updateBtn(); this.big.disabled = true; this.draw();
        const c = -dur;
        return this.msg(c === 101 || c === 150 ? "この動画は埋め込み再生が許可されていません"
          : c === 153 ? "YouTubeに再生を断られました（https:// のURLから開いているか確認してください）"
          : c === 100 ? "動画が見つからないか、非公開です"
          : c === 2 ? "URLが正しくありません"
          : "この動画は再生できません（ライブ配信などは対象外です）");
      }
      this.mode = "yt"; this.ytId = id; this.ytDur = dur; this._data = null;
      this.yt.setVolume(this.volume * 100);
      let title = ""; try { title = this.yt.getVideoData().title; } catch(e){}
      this.name = title || ("YouTube " + id);
      this.start = saved ? Math.min(saved.start, dur - 0.1) : 0;
      this.end = saved ? Math.min(saved.end, dur) : dur;
      this.big.disabled = false; this.updateBtn();
      this.$(".yturl").value = "";
      this.$(".ytshow").style.display = "";
      this.$(".fname").textContent = "▶ YouTube: " + this.name + "（全体 " + fmt(dur) + "）";
      this.msg("");
      this.refreshTrimUI();
      if (!saved) this.save();
    }
    ytError(code){ this.stop(); this.msg("YouTube再生エラー (" + code + ")"); }
    onYTState(s){
      if (this.mode !== "yt") return;
      const recent = Date.now() - this.cmdAt < 500;
      if (s === 0 && this.playing){            // 動画の最後まで再生した
        if (this.loop){ this.yt.seekTo(this.start, true); this.yt.playVideo(); } else this.stop();
      } else if (s === 2 && this.playing && !recent){   // 映像側をクリックして一時停止
        this.stop();
      } else if (s === 1 && !this.playing && !recent){  // 映像側をクリックして再生
        this.play();
      }
    }

    // ----- 保存/復元 -----
    async restore(){
      const r = await dbGet(this.id); if (!r) return;
      this.loop = r.loop; this.volume = r.volume; this.loopEl.checked = this.loop; this.volEl.value = this.volume;
      try {
        if (r.type === "yt"){
          await this.loadYouTube("https://youtu.be/" + r.id, r);
        } else {
          await this.setData(r.data.slice(0), r.name);
          this.start = r.start; this.end = Math.min(r.end, this.buffer.duration);
          this.refreshTrimUI();
        }
      } catch(e){}
    }
    save(){
      if (!this.mode) return;
      const base = { start: this.start, end: this.end, loop: this.loop, volume: this.volume, name: this.name };
      if (this.mode === "yt") dbPut(this.id, { ...base, type: "yt", id: this.ytId });
      else dbPut(this.id, { ...base, type: "file", data: this._data });
    }

    // ----- トリミング -----
    setTrim(s, e, commit){
      const d = this.duration(), minLen = 0.1;
      s = Math.min(Math.max(0, s || 0), d - minLen);
      e = Math.min(Math.max(s + minLen, e || d), d);
      this.start = s; this.end = e; this.refreshTrimUI();
      if (commit){ this.save(); if (this.playing) this.play(); }
    }
    refreshTrimUI(){
      this.ns.value = this.start.toFixed(1); this.ne.value = this.end.toFixed(1);
      this.$(".len").textContent = "再生長さ " + fmt(this.end - this.start);
      this.draw();
    }

    // ----- 再生/停止 -----
    toggle(){ this.playing ? this.stop() : this.play(); }
    play(){
      if (!this.mode) return;
      slots.forEach(s => { if (s !== this) s.stop(); });
      this.cmdAt = Date.now();
      if (this.mode === "yt") return this.playYT();
      const c = getCtx(); if (c.state === "suspended") c.resume();
      this.killSource();
      const src = c.createBufferSource(), g = c.createGain();
      src.buffer = this.buffer; g.gain.value = this.volume;
      src.connect(g).connect(c.destination);
      const dur = this.end - this.start;
      if (this.loop){ src.loop = true; src.loopStart = this.start; src.loopEnd = this.end; src.start(0, this.start); }
      else src.start(0, this.start, dur);
      src.onended = () => { if (this.src === src){ this.src = null; this.playing = false; this.updateBtn(); this.draw(); } };
      this.src = src; this.gain = g; this.t0 = c.currentTime; this.playing = true;
      this.updateBtn(); this.tick();
    }
    playYT(){
      const p = this.yt;
      p.setVolume(this.volume * 100);
      p.seekTo(this.start, true);
      p.playVideo();
      this.playing = true; this.guardUntil = Date.now() + 600;
      this.updateBtn(); this.startMon(); this.tick();
    }
    startMon(){
      clearInterval(this.mon);
      this.mon = setInterval(() => {
        if (!this.playing || this.mode !== "yt"){ clearInterval(this.mon); return; }
        if (Date.now() < this.guardUntil) return;
        const t = this.yt.getCurrentTime();
        if (t >= this.end - 0.05){
          if (this.loop){ this.guardUntil = Date.now() + 600; this.yt.seekTo(this.start, true); }
          else this.stop();
        }
      }, 100);
    }
    killSource(){
      if (this.src){ const s = this.src; this.src = null; s.onended = null; try { s.stop(); } catch(e){} try { s.disconnect(); } catch(e){} }
    }
    stop(){
      this.cmdAt = Date.now();
      this.killSource();
      this.playing = false;
      if (this.mode === "yt" && this.yt && this.yt.pauseVideo){
        clearInterval(this.mon);
        try { this.yt.pauseVideo(); this.yt.seekTo(this.start, true); } catch(e){}
      }
      this.updateBtn(); this.draw();
    }
    updateBtn(){
      this.el.classList.toggle("playing", this.playing);
      this.big.classList.toggle("stop", this.playing);
      this.big.textContent = !this.mode ? "音楽を読み込んでください" : this.playing ? "■ ストップ" : "▶ " + (this.id === "normal" ? "平常BGM 再生" : "ファンファーレ 再生");
    }
    pos(){
      if (!this.playing) return null;
      if (this.mode === "yt") { try { return Math.min(this.end, Math.max(this.start, this.yt.getCurrentTime())); } catch(e){ return null; } }
      const el = ctx.currentTime - this.t0, dur = this.end - this.start;
      return this.start + (this.loop ? el % dur : Math.min(el, dur));
    }
    tick(){ if (!this.playing) return; this.draw(); requestAnimationFrame(() => this.tick()); }

    // ----- 描画 -----
    draw(){
      const cv = this.cv, dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
      if (cv.width !== Math.round(w*dpr)) { cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); }
      const g = cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
      if (!this.mode){ g.fillStyle = "#555a73"; g.font = "13px sans-serif"; g.textAlign="center"; g.fillText("ここに波形が出ます（トリミングは左右の線をドラッグ）", w/2, h/2+4); return; }
      const d = this.duration(), xs = this.start/d*w, xe = this.end/d*w;
      const col = getComputedStyle(this.el).getPropertyValue("--c").trim();
      if (this.peaks){
        const n = this.peaks.length;
        for (let x = 0; x < w; x++){
          const p = this.peaks[Math.min(n-1, (x/w*n)|0)], bh = Math.max(1, p*h*0.9);
          g.fillStyle = (x >= xs && x <= xe) ? col : "#3a3f57";
          g.fillRect(x, (h-bh)/2, 1, bh);
        }
      } else {   // YouTubeは波形が取れないので帯で表示
        g.fillStyle = "#3a3f57"; g.fillRect(0, h*0.35, w, h*0.3);
        g.fillStyle = col; g.fillRect(xs, h*0.35, xe-xs, h*0.3);
      }
      g.fillStyle = "rgba(0,0,0,.45)"; g.fillRect(0,0,xs,h); g.fillRect(xe,0,w-xe,h);
      g.fillStyle = "#fff"; g.fillRect(xs-1,0,3,h); g.fillRect(xe-1,0,3,h);
      const p = this.pos();
      if (p != null){ const x = p/d*w; g.fillStyle = "#ff5a67"; g.fillRect(x-1,0,2,h); }
    }
    bindCanvas(){
      let drag = null;
      const xToT = e => { const r = this.cv.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left)/r.width)) * this.duration(); };
      this.cv.onpointerdown = e => {
        if (!this.mode) return;
        const r = this.cv.getBoundingClientRect(), d = this.duration();
        const xs = this.start/d*r.width, xe = this.end/d*r.width, x = e.clientX - r.left;
        drag = Math.abs(x - xs) <= Math.abs(x - xe) ? "s" : "e";
        this.cv.setPointerCapture(e.pointerId); this.cv.onpointermove(e);
      };
      this.cv.onpointermove = e => {
        if (!drag) return; const t = xToT(e);
        if (drag === "s") this.setTrim(t, this.end, false); else this.setTrim(this.start, t, false);
      };
      this.cv.onpointerup = () => { if (drag){ drag = null; this.save(); if (this.playing) this.play(); } };
    }
  }

  const wrap = document.getElementById("wrap");
  slots.push(new Slot("normal", "🎵 平常用", "normal", true));
  slots.push(new Slot("fanfare", "🎺 ファンファーレ用", "fanfare", false));
  slots.forEach(s => { wrap.appendChild(s.el); s.draw(); s.updateBtn(); s.restore(); });

  const stopAll = () => slots.forEach(s => s.stop());
  document.getElementById("stopAll").onclick = stopAll;
  addEventListener("keydown", e => {
    if (/INPUT|TEXTAREA/.test(e.target.tagName) && e.target.type !== "checkbox" && e.target.type !== "range") return;
    if (e.key === "1") slots[0].toggle();
    else if (e.key === "2") slots[1].toggle();
    else if (e.key === "Escape") stopAll();
  });
  addEventListener("resize", () => slots.forEach(s => s.draw()));
})();
</script>
</body>
</html>
